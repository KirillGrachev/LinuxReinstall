name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck-and-bats:
    name: shellcheck + bats (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats fdisk ifupdown openssh-server

      - name: ShellCheck every shell file
        run: |
          shellcheck -x reinstall.sh tests/run-tests.sh lib/*.sh lib/bootstrap/*.sh

      - name: Bats suites
        run: ./tests/run-tests.sh
